---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: dev-workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: api-gateway
          image: ${HARBOR_HOST}/dev-workflow/smarttask-api-gateway:${DOCKER_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"
            - name: TASK_SERVICE_URL
              value: "http://task-service:5002"
            - name: JWT_SECRET
              value: "MySecret@123"
