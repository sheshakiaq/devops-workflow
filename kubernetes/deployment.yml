apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: dev-workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: report-service
          image: ${HARBOR_HOST}/dev-workflow/smarttask-report-service:${DOCKER_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 5004
          env:
            - name: PORT
              value: "5004"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/reportdb"
            - name: JWT_SECRET
              value: "MySecret@123"
