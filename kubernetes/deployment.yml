---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dev-workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: auth-service
          image: ${HARBOR_HOST}/dev-workflow/smarttask-auth-service:${DOCKER_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
